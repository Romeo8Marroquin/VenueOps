<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <!--
        VenueOps app icon — full icon (used as-is on iOS, Windows, macOS).
        Background rounded-rect is included here; Android adaptive icon
        uses appiconfg.svg as foreground layer with a separate system bg.
    -->

    <!-- Brand dark-green background with rounded corners -->
    <rect x="0" y="0" width="456" height="456" rx="92" fill="#285A48"/>

    <!-- Outer glow ring — subtle depth (very low opacity) -->
    <rect x="0" y="0" width="456" height="456" rx="92"
          fill="none" stroke="#408A71" stroke-width="6" opacity="0.5"/>

    <!--
        The V mark:
        Two bold arms converge from the upper-left and upper-right
        to a single lower-center vertex.  Metaphor: stage-curtain
        perspective / venue entrance / the letter V for VenueOps.
    -->
    <polyline
        points="82,108 228,346 374,108"
        fill="none"
        stroke="#B0E4CC"
        stroke-width="52"
        stroke-linecap="round"
        stroke-linejoin="round"/>

    <!--
        Stage-floor accent: a short horizontal bar below the vertex.
        Reinforces the venue/stage metaphor and grounds the mark.
    -->
    <rect x="192" y="362" width="72" height="12" rx="6" fill="#408A71"/>
</svg>
