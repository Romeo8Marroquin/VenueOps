<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <!--
        VenueOps splash screen mark.
        Background colour #091413 is set in the csproj MauiSplashScreen Color attribute —
        this SVG only defines the centred foreground graphic.

        The V is slightly larger than the icon variant for better splash visibility,
        and vertically centred in the viewport.
    -->

    <!-- V mark -->
    <polyline
        points="96,116 228,340 360,116"
        fill="none"
        stroke="#B0E4CC"
        stroke-width="44"
        stroke-linecap="round"
        stroke-linejoin="round"/>

    <!-- Stage-floor accent -->
    <rect x="196" y="356" width="64" height="10" rx="5" fill="#408A71"/>
</svg>
