<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <!--
        VenueOps app icon — foreground layer (Android adaptive icon).
        Transparent background; the system applies the background colour/shape.
        Content is centred within the 66 % safe zone (≈ 76 px padding all sides
        on a 456 px canvas) so it survives circular/squircle clipping.

        Safe-zone bounds: x [76 … 380],  y [76 … 380]
        V coordinates stay well inside: x [82 … 374],  y [108 … 374]
    -->

    <!-- V mark (same proportions as appicon.svg) -->
    <polyline
        points="82,108 228,346 374,108"
        fill="none"
        stroke="#B0E4CC"
        stroke-width="52"
        stroke-linecap="round"
        stroke-linejoin="round"/>

    <!-- Stage-floor accent -->
    <rect x="192" y="362" width="72" height="12" rx="6" fill="#408A71"/>
</svg>
